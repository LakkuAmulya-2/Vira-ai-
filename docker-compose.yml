services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vira
      POSTGRES_USER: vira
      POSTGRES_PASSWORD: change-me-before-production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vira -d vira"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
