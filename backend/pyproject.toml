[project]
name = "vira-api"
version = "0.1.0"
description = "Vira AI production backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.15,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "structlog>=25.2,<26.0",
  "httpx>=0.28,<1.0",
  "redis>=5.2,<6.0",
  "beautifulsoup4>=4.12,<5.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0"
]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
